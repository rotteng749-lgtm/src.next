# Build the panxcz-browser APK.
#
# This repository is a patch overlay on Chromium, not a buildable tree: it has
# no .gn, no DEPS and no third_party/llvm. The previous workflow delegated the
# compile to http://longbuild.find.kiwi, which stopped resolving after Kiwi was
# archived. This workflow does the build itself.
#
# It checks out upstream Chromium at the tag recorded in CHROMIUM_VERSION, then
# copies this repository over that tree so the overlay files win, then runs
# gn + ninja. Only arm64 is built: a full Chromium Android build takes several
# hours and the GitHub-hosted runner has a 6 hour job limit, so one ABI is the
# most that fits.
name: 'Build panxcz-browser APK'

on:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          set -eux
          sudo swapoff -a || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git python3 python-is-python3 curl unzip rsync ccache \
            openjdk-17-jdk-headless pkg-config lsb-release sudo
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libnss3-dev libnspr4-dev libdbus-1-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev \
            libxkbcommon-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libgbm-dev libpango1.0-dev libcairo2-dev libasound2-dev \
            libxshmfence-dev || true

      - name: Checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Read Chromium version
        id: version
        run: |
          set -eux
          # The checkout lands in overlay/, so the version file is not at the
          # runner's working directory root.
          # shellcheck disable=SC1091
          source overlay/CHROMIUM_VERSION
          TAG="${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building against Chromium ${TAG}"

      - name: Fetch Chromium source
        run: |
          set -eux
          git clone --depth 1 --branch "${{ steps.version.outputs.tag }}" \
            https://chromium.googlesource.com/chromium/src.git chromium

      - name: Sync Chromium dependencies
        run: |
          set -eux
          cd chromium
          # Fetch depot_tools, which provides gclient.
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git ../depot_tools
          export PATH="$PWD/../depot_tools:$PATH"
          # gclient reads DEPS and pulls every third_party dependency, the
          # sysroot and the toolchain. This is the bulk of the checkout.
          gclient sync --no-history --shallow -D

      - name: Apply overlay
        run: |
          set -eux
          # Copy the overlay on top of upstream. Files present in both trees
          # are replaced by the overlay version. VCS metadata is excluded so
          # the chromium checkout stays intact.
          rsync -a --exclude '.git' --exclude '.github' overlay/ chromium/

      - name: Generate build files
        run: |
          set -eux
          export PATH="$PWD/depot_tools:$PATH"
          mkdir -p chromium/out/android_arm64
          cp overlay/.build/production_build_reference/args.gn \
            chromium/out/android_arm64/args.gn
          cd chromium
          gn gen out/android_arm64

      - name: Build APK
        run: |
          set -eux
          export PATH="$PWD/depot_tools:$PATH"
          export NINJA_STATUS='[%f/%t %e] '
          cd chromium
          ninja -C out/android_arm64 -j"$(nproc)" chrome_public_apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panxcz-browser-arm64
          path: chromium/out/android_arm64/apks/*.apk
          if-no-files-found: error
          retention-days: 14
