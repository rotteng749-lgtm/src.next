# Build the panxcz-browser APK.
#
# This repository is a patch overlay on Chromium, not a buildable tree: it has
# no .gn, no DEPS and no third_party/llvm. The previous workflow delegated the
# compile to http://longbuild.find.kiwi, which stopped resolving after Kiwi was
# archived. This workflow does the build itself.
#
# It creates a gclient workspace pinned to the tag in CHROMIUM_VERSION, syncs
# the Android dependencies, copies this repository over the Chromium tree so
# the overlay files win, then runs gn + ninja. Only arm64 is built: a full
# Chromium Android build takes several hours and the hosted runner has a 6 hour
# job limit, so one ABI is the most that fits.
name: 'Build panxcz-browser APK'

on:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          set -eux
          sudo swapoff -a || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git python3 python-is-python3 curl unzip rsync ccache \
            openjdk-11-jdk-headless pkg-config lsb-release sudo \
            libglib2.0-dev libnss3-dev libnspr4-dev libdbus-1-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev \
            libxkbcommon-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libgbm-dev libpango1.0-dev libcairo2-dev libasound2-dev \
            libxshmfence-dev
          # Chromium 105 predates JDK 17 support; pin JDK 11 for the Android
          # gradle step.
          sudo update-alternatives --set java \
            /usr/lib/jvm/java-11-openjdk-amd64/bin/java
          java -version

      - name: Checkout overlay
        uses: actions/checkout@v5
        with:
          path: overlay

      - name: Read Chromium version
        id: version
        run: |
          set -eux
          # The checkout lands in overlay/, so the version file is not at the
          # runner's working directory root.
          # shellcheck disable=SC1091
          source overlay/CHROMIUM_VERSION
          TAG="${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building against Chromium ${TAG}"

      - name: Set up depot_tools
        run: |
          set -eux
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$GITHUB_WORKSPACE/depot_tools"
          echo "$GITHUB_WORKSPACE/depot_tools" >> "$GITHUB_PATH"

      - name: Configure gclient workspace
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/cr"
          cat > "$GITHUB_WORKSPACE/cr/.gclient" <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                # Chromium 105's DEPS hook pulls a prebuilt from the
                # chromium-tools-traffic_annotation bucket, and that object no
                # longer exists upstream. The auditor is only used by the
                # network-traffic annotation presubmit, not by the browser
                # build, so skip the checkout.
                "checkout_traffic_annotation_tools": False,
              },
            },
          ]
          target_os = ["android"]
          EOF
          # gclient reads the pinned revision from the solution checkout, so
          # put src on the exact tag before syncing.
          cd "$GITHUB_WORKSPACE/cr"
          git clone --depth 1 --branch "${{ steps.version.outputs.tag }}" \
            https://chromium.googlesource.com/chromium/src.git src

      - name: Sync Chromium dependencies
        run: |
          set -eux
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/cr"
          # Pulls third_party, the Android SDK/NDK and the clang toolchain.
          # This is the bulk of the checkout and the slowest step.
          #
          # A first sync can still trip over a DEPS hook whose GCS object was
          # removed upstream years after this tag was cut. Hooks are
          # re-entrant, so retry once: already-downloaded objects are skipped
          # and only the failing hook runs again. If it fails a second time,
          # continue anyway: no hook is required to compile the browser, and
          # gn will report anything genuinely missing.
          gclient sync --no-history --shallow -D \
            || gclient sync --no-history --shallow -D \
            || echo "::warning::gclient sync reported hook failures; continuing"
          df -h

      - name: Apply overlay
        run: |
          set -eux
          # Merge the overlay into the Chromium tree. Files present in both
          # are replaced by the overlay version. VCS and CI metadata are
          # excluded so the chromium checkout stays intact.
          rsync -a --exclude '.git' --exclude '.github' \
            "$GITHUB_WORKSPACE/overlay/" "$GITHUB_WORKSPACE/cr/src/"

      - name: Patch upstream for mobile extensions
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/cr/src"
          # Kiwi enables extensions on Android, so it uses GuestViews on
          # mobile. Upstream guards against that with an assert whose own
          # comment says to remove it if GuestViews are used on mobile:
          #   "If you're now using GuestViews on mobile, go ahead and remove
          #    this assert."
          # Without this, gn gen fails at extensions/BUILD.gn:162 which pulls
          # //components/guest_view/browser:test_support.
          test -f components/guest_view/browser/BUILD.gn
          sed -i \
            's|^assert(!is_android \&\& !is_ios)$|# assert removed: Kiwi uses GuestViews on Android (extensions enabled).|' \
            components/guest_view/browser/BUILD.gn
          grep -n "assert removed" components/guest_view/browser/BUILD.gn

      - name: Generate signing key
        run: |
          set -eux
          # args.gn points at ../../keystore.jks relative to out/android_arm64,
          # which resolves to the Chromium source root.
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/cr/src/keystore.jks" \
            -alias dev -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass public_password -keypass public_password \
            -dname "cn=panxcz-browser (unverified), ou=Actions, o=panxcz-browser, c=GitHub"

      - name: Generate build files
        run: |
          set -eux
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/cr/src"
          mkdir -p out/android_arm64
          cp "$GITHUB_WORKSPACE/overlay/.build/production_build_reference/args.gn" \
            out/android_arm64/args.gn
          gn gen out/android_arm64

      - name: Build APK
        run: |
          set -eux
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          export NINJA_STATUS='[%f/%t %e] '
          cd "$GITHUB_WORKSPACE/cr/src"
          autoninja -C out/android_arm64 -j"$(nproc)" chrome_public_apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panxcz-browser-arm64
          path: cr/src/out/android_arm64/apks/*.apk
          if-no-files-found: error
          retention-days: 14
